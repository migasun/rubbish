name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy
      options: --ipc=host
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Prepare test artifacts directory
        run: mkdir -p test-results

      - name: Run unit tests
        run: |
          set -o pipefail
          npm run test:unit | tee test-results/unit-tests.log

      - name: Run end-to-end tests
        run: |
          set -o pipefail
          npm run test:e2e | tee test-results/e2e-tests.log

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test-results/
